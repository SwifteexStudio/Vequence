<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vequence — Research, sourced and sequenced</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header id="site-header"></header>

<main class="shell-narrow">
  <div style="padding-top:44px;">
    <h1 class="page-title">Research, sourced.</h1>
    <p class="page-sub">Knowledge worth trusting — every claim traced back to where it came from.</p>
  </div>

  <div class="filter-bar" id="filter-bar">
    <div class="chip-row" id="tag-filters">
      <button class="chip active" data-category="">All</button>
    </div>
    <select class="sort-select" id="sort-select">
      <option value="for-you">For you</option>
      <option value="recent">Most recent</option>
      <option value="popular">Most liked</option>
      <option value="discussed">Most discussed</option>
    </select>
  </div>

  <div id="feed"></div>
  <div id="feed-empty"></div>
</main>

<footer id="site-footer"></footer>

<script type="module">
import {
  supabase, requireAuth, initHeader, initFooter, escapeHtml, formatDate,
  avatarHtml, qs, toast, getCurrentProfile
} from './app.js';

const feedEl = document.getElementById('feed');
const emptyEl = document.getElementById('feed-empty');
const tagFiltersEl = document.getElementById('tag-filters');
const sortSelect = document.getElementById('sort-select');

let activeCategory = '';
let sortMode = 'for-you';
let searchQuery = qs('q') || '';
let session = null;
let myProfile = null;
let userInterests = [];
let followingIds = new Set();
let likedArticleIds = new Set();

const CATEGORIES = ['Neuroscience', 'Technology', 'Health', 'Economics', 'Physics', 'Psychology', 'Climate', 'AI & ML'];

(async () => {
  // Gate: must be signed in to use Discover
  session = await requireAuth('auth.html');
  if (!session) return;

  const header = await initHeader('discover');
  myProfile = header.profile;
  initFooter();

  // Load personalization signals in parallel
  const [interestsFromMeta, followsRes, likesRes] = await Promise.all([
    Promise.resolve(session.user.user_metadata?.interests || []),
    supabase.from('follows').select('followed_id').eq('follower_id', session.user.id),
    supabase.from('likes').select('article_id').eq('user_id', session.user.id).limit(200)
  ]);

  try {
    const local = JSON.parse(localStorage.getItem('vequence-interests') || '[]');
    userInterests = Array.isArray(interestsFromMeta) && interestsFromMeta.length
      ? interestsFromMeta
      : (Array.isArray(local) ? local : []);
  } catch (_) {
    userInterests = Array.isArray(interestsFromMeta) ? interestsFromMeta : [];
  }

  followingIds = new Set((followsRes.data || []).map(f => f.followed_id));
  likedArticleIds = new Set((likesRes.data || []).map(l => l.article_id));

  // Default sort: For you when we have signals, else recent
  if (!userInterests.length && !followingIds.size) {
    sortMode = 'recent';
    sortSelect.value = 'recent';
  }

  renderCategoryChips();
  loadFeed();
  wireLiveSearch();
})();

function wireLiveSearch() {
  const input = document.getElementById('header-search-input');
  const form = document.getElementById('header-search-form');
  if (!input || !form) return;

  // Intercept the form's normal full-page navigation and instead filter
  // in place — faster, and preserves scroll position / active filters.
  form.addEventListener('submit', (e) => {
    e.preventDefault();
    searchQuery = input.value.trim();
    updateUrlQuery(searchQuery);
    loadFeed();
  });

  let debounceTimer;
  input.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      const value = input.value.trim();
      if (value === searchQuery) return;
      searchQuery = value;
      updateUrlQuery(searchQuery);
      loadFeed();
    }, 350);
  });

  // Clear button (in the header) already empties the input and re-submits;
  // that submit is caught above, so no extra wiring needed here.
}

function updateUrlQuery(value) {
  const url = new URL(window.location.href);
  if (value) url.searchParams.set('q', value);
  else url.searchParams.delete('q');
  window.history.replaceState({}, '', url);
}

function renderCategoryChips() {
  // Prioritize interest categories at the front when present
  const ordered = [
    ...CATEGORIES.filter(c => userInterests.includes(c)),
    ...CATEGORIES.filter(c => !userInterests.includes(c))
  ];
  tagFiltersEl.innerHTML =
    `<button class="chip ${activeCategory === '' ? 'active' : ''}" data-category="">All</button>` +
    ordered.map(c =>
      `<button class="chip ${activeCategory === c ? 'active' : ''} ${userInterests.includes(c) ? 'interest-chip' : ''}" data-category="${escapeHtml(c)}">${escapeHtml(c)}</button>`
    ).join('');

  tagFiltersEl.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      activeCategory = chip.dataset.category;
      renderCategoryChips();
      loadFeed();
    });
  });
}

function rowSkeleton() {
  return `
    <div class="article-row">
      <div class="article-row-thumb skeleton" style="width:160px;height:100px;"></div>
      <div class="article-row-main">
        <div class="skeleton" style="width:120px;height:14px;margin-bottom:10px;"></div>
        <div class="skeleton" style="width:80%;height:26px;margin-bottom:10px;"></div>
        <div class="skeleton" style="width:60%;height:16px;margin-bottom:16px;"></div>
        <div class="skeleton" style="width:180px;height:14px;"></div>
      </div>
    </div>`;
}

function articleRow(article) {
  const author = article.users;
  const img = article.hero_image_url
    ? `<a href="article.html?slug=${encodeURIComponent(article.slug)}" class="article-row-thumb"><img src="${escapeHtml(article.hero_image_url)}" alt="" loading="lazy"></a>`
    : '';
  return `
    <article class="article-row">
      ${img}
      <div class="article-row-main">
        ${article.category ? `<div class="kicker">${escapeHtml(article.category)}</div>` : ''}
        <h2><a href="article.html?slug=${encodeURIComponent(article.slug)}">${escapeHtml(article.title)}</a></h2>
        ${article.subtitle ? `<p class="dek">${escapeHtml(article.subtitle)}</p>` : ''}
        <div class="byline">
          ${avatarHtml(author, 22)}
          <span class="author-name">${escapeHtml(author?.display_name || author?.username || 'Unknown')}</span>
          <span>·</span>
          <span>${formatDate(article.published_at || article.created_at)}</span>
          <span>·</span>
          <span>${article.reading_time_minutes || 1} min read</span>
        </div>
        <div class="article-row-stats">
          ${article.sources_count > 0 ? `<span class="evidence-badge">📎 ${article.sources_count} source${article.sources_count > 1 ? 's' : ''}</span>` : ''}
          <span>♥ ${article.like_count || 0}</span>
          <span>💬 ${article.comment_count || 0}</span>
        </div>
      </div>
    </article>`;
}

/**
 * Personalized ranking score.
 * Combines: interest match, following author, engagement, evidence quality, recency.
 */
function scoreArticle(a, now = Date.now()) {
  let score = 0;

  // Interest / category affinity
  if (userInterests.includes(a.category)) score += 40;

  // Tag overlap with interests (soft match)
  const tagNames = (a.article_tags || []).map(t => t.tags?.name).filter(Boolean);
  for (const t of tagNames) {
    if (userInterests.some(i => i.toLowerCase() === t.toLowerCase())) score += 8;
  }

  // Authors you follow
  if (followingIds.has(a.author_id)) score += 35;

  // Evidence quality signal
  const srcCount = a.sources_count || 0;
  score += Math.min(srcCount * 4, 20);

  // Engagement (log-ish dampening)
  const likes = a.like_count || 0;
  const comments = a.comment_count || 0;
  score += Math.min(likes * 1.5, 25);
  score += Math.min(comments * 2, 20);

  // Recency decay (half-life ~7 days)
  const published = new Date(a.published_at || a.created_at || 0).getTime();
  const ageDays = Math.max(0, (now - published) / 86400000);
  const recency = 30 * Math.exp(-ageDays / 7);
  score += recency;

  // Mild boost for having a cover image (completeness)
  if (a.hero_image_url) score += 3;

  // Don't over-rank things the user already liked (slight demotion for variety)
  if (likedArticleIds.has(a.id)) score -= 5;

  return score;
}

async function loadFeed() {
  feedEl.innerHTML = rowSkeleton() + rowSkeleton() + rowSkeleton();
  emptyEl.innerHTML = '';

  let query = supabase
    .from('articles')
    .select('*, users(username, display_name, avatar_url), article_tags(tags(name)), sources(id)')
    .eq('status', 'published');

  if (activeCategory) query = query.eq('category', activeCategory);
  if (searchQuery) {
    // Escape characters that are meaningful to PostgREST's or()/ilike syntax
    // so a comma or % in someone's search doesn't break the filter or match
    // unintended wildcards.
    const safe = searchQuery.replace(/[%,()]/g, '');
    if (safe) query = query.or(`title.ilike.%${safe}%,subtitle.ilike.%${safe}%`);
  }

  // Fetch a wider pool when ranking client-side for "for you"
  const limit = sortMode === 'for-you' ? 60 : 30;

  if (sortMode === 'popular') query = query.order('like_count', { ascending: false });
  else if (sortMode === 'discussed') query = query.order('comment_count', { ascending: false });
  else if (sortMode === 'recent') query = query.order('published_at', { ascending: false });
  else query = query.order('published_at', { ascending: false }); // base pool for for-you

  const { data, error } = await query.limit(limit);

  if (error) {
    toast('Could not load articles', 'error');
    feedEl.innerHTML = '';
    return;
  }

  let articles = (data || []).map(a => ({
    ...a,
    sources_count: (a.sources || []).length
  }));

  if (sortMode === 'for-you') {
    const now = Date.now();
    articles = articles
      .map(a => ({ a, s: scoreArticle(a, now) }))
      .sort((x, y) => y.s - x.s)
      .map(x => x.a);
  }

  articles = articles.slice(0, 30);

  if (articles.length === 0) {
    feedEl.innerHTML = '';
    emptyEl.innerHTML = `
      <div class="empty-state">
        <h3>Nothing here yet</h3>
        <p>${searchQuery ? `No articles matched "${escapeHtml(searchQuery)}".` : 'Be the first to publish research in this topic.'}</p>
        ${searchQuery ? `<button class="btn btn-quiet btn-sm" id="clear-search-btn" style="margin-top:14px;">Clear search</button>` : ''}
      </div>`;
    const clearBtn = document.getElementById('clear-search-btn');
    if (clearBtn) clearBtn.addEventListener('click', () => {
      const input = document.getElementById('header-search-input');
      if (input) input.value = '';
      searchQuery = '';
      updateUrlQuery('');
      loadFeed();
    });
    return;
  }

  feedEl.innerHTML = articles.map(articleRow).join('');
}

sortSelect.addEventListener('change', () => {
  sortMode = sortSelect.value;
  loadFeed();
});
</script>
</body>
</html>
