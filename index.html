<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vequence: Research, sourced and sequenced</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header id="site-header"></header>

<main class="shell-narrow">
  <div style="padding-top:44px;">
    <h1 class="page-title">Research, sourced.</h1>
    <p class="page-sub">Knowledge worth trusting — every claim traced back to where it came from.</p>
  </div>

  <div class="filter-bar" id="filter-bar">
    <div class="chip-row" id="tag-filters">
      <button class="chip active" data-category="">All</button>
    </div>
    <select class="sort-select" id="sort-select">
      <option value="recent" selected>Most recent</option>
      <option value="for-you">For you</option>
      <option value="popular">Most liked</option>
      <option value="discussed">Most discussed</option>
    </select>
  </div>

  <div id="people-results"></div>
  <div id="feed"></div>
  <div id="feed-empty"></div>
</main>

<footer id="site-footer"></footer>

<script type="module">
import {
  supabase, requireAuth, initHeader, initFooter, escapeHtml, formatDate,
  avatarHtml, qs, toast, getCurrentProfile, adminBadgeHtml, readingTimeLabel, articleReadingMinutes } from './app.js';

const feedEl = document.getElementById('feed');
const emptyEl = document.getElementById('feed-empty');
const peopleEl = document.getElementById('people-results');
const tagFiltersEl = document.getElementById('tag-filters');
const sortSelect = document.getElementById('sort-select');
let realtimeChannel = null;
let loadFeedToken = 0;

let activeCategory = '';
let sortMode = 'recent';
const searchQuery = qs('q') || '';
let session = null;
let myProfile = null;
let userInterests = [];
let followingIds = new Set();
let likedArticleIds = new Set();
/** When true, helper accounts (+ @voyeger) are excluded from Discover. Controlled in Settings. */
let hideHelpersEnabled = false;
let hiddenAuthorIds = new Set();
const HIDDEN_USERNAMES = new Set(['voyeger']);
const HIDE_HELPERS_KEY = 'vequence-hide-helpers';

function readHideHelpersPref(session) {
  const meta = session?.user?.user_metadata?.hide_helper_articles;
  if (typeof meta === 'boolean') return meta;
  try {
    const v = localStorage.getItem(HIDE_HELPERS_KEY);
    if (v === '1' || v === 'true') return true;
    if (v === '0' || v === 'false') return false;
  } catch (_) {}
  return false; // default OFF → helpers visible
}

const CATEGORIES = ['Neuroscience', 'Technology', 'Health', 'Economics', 'Physics', 'Psychology', 'Climate', 'AI & ML'];

(async () => {
  // Gate: must be signed in to use Discover
  session = await requireAuth('auth.html');
  if (!session) return;

  const header = await initHeader('discover');
  myProfile = header.profile;
  initFooter();

  // Load personalization signals in parallel
  const [interestsFromMeta, followsRes, likesRes] = await Promise.all([
    Promise.resolve(session.user.user_metadata?.interests || []),
    supabase.from('follows').select('followed_id').eq('follower_id', session.user.id),
    supabase.from('likes').select('article_id').eq('user_id', session.user.id).limit(200)
  ]);

  try {
    const local = JSON.parse(localStorage.getItem('vequence-interests') || '[]');
    userInterests = Array.isArray(interestsFromMeta) && interestsFromMeta.length
      ? interestsFromMeta
      : (Array.isArray(local) ? local : []);
  } catch (_) {
    userInterests = Array.isArray(interestsFromMeta) ? interestsFromMeta : [];
  }

  followingIds = new Set((followsRes.data || []).map(f => f.followed_id));
  likedArticleIds = new Set((likesRes.data || []).map(l => l.article_id));

  // Preference: hide helper / @voyeger articles only when enabled in Settings
  hideHelpersEnabled = readHideHelpersPref(session);
  hiddenAuthorIds = new Set();
  if (hideHelpersEnabled) {
    try {
      const { data: hiddenUsers } = await supabase
        .from('users')
        .select('id, username, is_helper')
        .or('is_helper.eq.true,username.ilike.voyeger');
      hiddenAuthorIds = new Set(
        (hiddenUsers || [])
          .filter(u => u.is_helper || HIDDEN_USERNAMES.has(String(u.username || '').toLowerCase()))
          .map(u => u.id)
      );
      const { data: named } = await supabase
        .from('users')
        .select('id, username')
        .in('username', [...HIDDEN_USERNAMES]);
      for (const u of named || []) hiddenAuthorIds.add(u.id);
    } catch (_) {
      hiddenAuthorIds = new Set();
    }
  }

  // Default sort: For you when we have signals, else recent
  if (!userInterests.length && !followingIds.size) {
    sortMode = 'recent';
    sortSelect.value = 'recent';
  }

  renderCategoryChips();
  loadFeed();
  subscribeRealtime();
})();

function renderCategoryChips() {
  // Prioritize interest categories at the front when present
  const ordered = [
    ...CATEGORIES.filter(c => userInterests.includes(c)),
    ...CATEGORIES.filter(c => !userInterests.includes(c))
  ];
  tagFiltersEl.innerHTML =
    `<button class="chip ${activeCategory === '' ? 'active' : ''}" data-category="">All</button>` +
    ordered.map(c =>
      `<button class="chip ${activeCategory === c ? 'active' : ''} ${userInterests.includes(c) ? 'interest-chip' : ''}" data-category="${escapeHtml(c)}">${escapeHtml(c)}</button>`
    ).join('');

  tagFiltersEl.querySelectorAll('.chip').forEach(chip => {
    chip.addEventListener('click', () => {
      activeCategory = chip.dataset.category;
      renderCategoryChips();
      loadFeed();
    });
  });
}

function rowSkeleton() {
  return `
    <div class="article-row">
      <div class="article-row-thumb skeleton" style="width:160px;height:100px;"></div>
      <div class="article-row-main">
        <div class="skeleton" style="width:120px;height:14px;margin-bottom:10px;"></div>
        <div class="skeleton" style="width:80%;height:26px;margin-bottom:10px;"></div>
        <div class="skeleton" style="width:60%;height:16px;margin-bottom:16px;"></div>
        <div class="skeleton" style="width:180px;height:14px;"></div>
      </div>
    </div>`;
}

function articleRow(article) {
  const author = article.users;
  const img = article.hero_image_url
    ? `<a href="article.html?slug=${encodeURIComponent(article.slug)}" class="article-row-thumb"><img src="${escapeHtml(article.hero_image_url)}" alt="" loading="lazy"></a>`
    : '';
  return `
    <article class="article-row">
      ${img}
      <div class="article-row-main">
        ${article.category ? `<div class="kicker">${escapeHtml(article.category)}</div>` : ''}
        <h2><a href="article.html?slug=${encodeURIComponent(article.slug)}">${escapeHtml(article.title)}</a></h2>
        ${article.subtitle ? `<p class="dek">${escapeHtml(article.subtitle)}</p>` : ''}
        <div class="byline">
          ${avatarHtml(author, 22)}
          <span class="author-name">${escapeHtml(author?.display_name || author?.username || 'Unknown')} ${adminBadgeHtml(author)}</span>
          <span>·</span>
          <span>${formatDate(article.published_at || article.created_at)}</span>
          <span>·</span>
          <span>${readingTimeLabel(articleReadingMinutes(article))}</span>
        </div>
        <div class="article-row-stats">
          ${article.sources_count > 0 ? `<span class="evidence-badge">📎 ${article.sources_count} source${article.sources_count > 1 ? 's' : ''}</span>` : ''}
          <span>♥ ${article.like_count || 0}</span>
          <span>💬 ${article.comment_count || 0}</span>
        </div>
      </div>
    </article>`;
}

/**
 * Personalized ranking score.
 * Combines: interest match, following author, engagement, evidence quality, recency.
 */
function scoreArticle(a, now = Date.now()) {
  let score = 0;

  // Interest / category affinity
  if (userInterests.includes(a.category)) score += 40;

  // Tag overlap with interests (soft match)
  const tagNames = (a.article_tags || []).map(t => t.tags?.name).filter(Boolean);
  for (const t of tagNames) {
    if (userInterests.some(i => i.toLowerCase() === t.toLowerCase())) score += 8;
  }

  // Authors you follow
  if (followingIds.has(a.author_id)) score += 35;

  // Evidence quality signal
  const srcCount = a.sources_count || 0;
  score += Math.min(srcCount * 4, 20);

  // Engagement (log-ish dampening)
  const likes = a.like_count || 0;
  const comments = a.comment_count || 0;
  score += Math.min(likes * 1.5, 25);
  score += Math.min(comments * 2, 20);

  // Recency: stronger preference for latest articles (half-life ~3 days)
  const published = new Date(a.published_at || a.created_at || 0).getTime();
  const ageDays = Math.max(0, (now - published) / 86400000);
  const recency = 55 * Math.exp(-ageDays / 3);
  score += recency;

  // Mild boost for having a cover image (completeness)
  if (a.hero_image_url) score += 3;

  // Don't over-rank things the user already liked (slight demotion for variety)
  if (likedArticleIds.has(a.id)) score -= 5;

  return score;
}

async function loadPeople() {
  if (!peopleEl) return;
  if (!searchQuery) {
    peopleEl.innerHTML = '';
    return;
  }
  const q = searchQuery.trim();
  let peopleQuery = supabase
    .from('users')
    .select('id, username, display_name, avatar_url, bio, is_admin, is_helper')
    .or(`username.ilike.%${q}%,display_name.ilike.%${q}%`)
    .order('username', { ascending: true })
    .limit(12);
  if (hideHelpersEnabled) peopleQuery = peopleQuery.eq('is_helper', false);

  const { data, error } = await peopleQuery;

  const people = (data || []).filter(u => {
    if (!hideHelpersEnabled) return true;
    if (u.is_helper) return false;
    if (HIDDEN_USERNAMES.has(String(u.username || '').toLowerCase())) return false;
    return true;
  });
  if (error || !people.length) {
    peopleEl.innerHTML = '';
    return;
  }

  peopleEl.innerHTML = `
    <section class="people-results-section" style="margin-bottom:28px;">
      <h2 class="section-label" style="font-size:13px;letter-spacing:0.04em;text-transform:uppercase;opacity:0.7;margin-bottom:12px;">People</h2>
      <div class="people-grid" style="display:grid;gap:10px;">
        ${people.map(u => `
          <a href="profile.html?u=${encodeURIComponent(u.username)}" class="people-row" style="display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;text-decoration:none;color:inherit;background:var(--surface-2, transparent);">
            ${avatarHtml(u, 40)}
            <div style="min-width:0;flex:1;">
              <div style="font-weight:600;display:flex;align-items:center;gap:6px;">
                ${escapeHtml(u.display_name || u.username)} ${adminBadgeHtml(u)}
              </div>
              <div style="font-size:13px;opacity:0.7;">@${escapeHtml(u.username)}</div>
              ${u.bio ? `<div style="font-size:13px;opacity:0.75;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${escapeHtml(u.bio)}</div>` : ''}
            </div>
          </a>
        `).join('')}
      </div>
    </section>`;
}

async function loadFeed() {
  const token = ++loadFeedToken;
  feedEl.innerHTML = rowSkeleton() + rowSkeleton() + rowSkeleton();
  emptyEl.innerHTML = '';

  // People search runs in parallel with articles when there is a query
  const peoplePromise = loadPeople();

  let query = supabase
    .from('articles')
    .select('*, users(username, display_name, avatar_url, is_admin, is_helper), article_tags(tags(name)), sources(id)')
    .eq('status', 'published');

  // Server-side exclude helper / blocked authors only when preference is on
  if (hideHelpersEnabled && hiddenAuthorIds.size) {
    query = query.not('author_id', 'in', `(${[...hiddenAuthorIds].join(',')})`);
  }

  if (activeCategory) query = query.eq('category', activeCategory);
  if (searchQuery) {
    // Search title, subtitle, and category
    query = query.or(`title.ilike.%${searchQuery}%,subtitle.ilike.%${searchQuery}%,category.ilike.%${searchQuery}%`);
  }

  // Fetch a wider pool when ranking client-side for "for you"
  const limit = sortMode === 'for-you' ? 60 : 30;

  // Always prefer newest as the primary ordering; secondary sorts layer on top
  if (sortMode === 'popular') query = query.order('like_count', { ascending: false }).order('published_at', { ascending: false });
  else if (sortMode === 'discussed') query = query.order('comment_count', { ascending: false }).order('published_at', { ascending: false });
  else query = query.order('published_at', { ascending: false }); // recent + for-you base pool

  const { data, error } = await query.limit(limit);
  await peoplePromise;

  // Ignore stale responses if a newer loadFeed started
  if (token !== loadFeedToken) return;

  if (error) {
    toast('Could not load articles', 'error');
    feedEl.innerHTML = '';
    return;
  }

  let articles = (data || [])
    .filter(a => {
      if (!hideHelpersEnabled) return true;
      const uname = String(a.users?.username || '').toLowerCase();
      if (a.users?.is_helper) return false;
      if (HIDDEN_USERNAMES.has(uname)) return false;
      if (a.author_id && hiddenAuthorIds.has(a.author_id)) return false;
      return true;
    })
    .map(a => ({
      ...a,
      sources_count: (a.sources || []).length
    }));

  if (sortMode === 'for-you') {
    const now = Date.now();
    articles = articles
      .map(a => ({ a, s: scoreArticle(a, now) }))
      .sort((x, y) => y.s - x.s)
      .map(x => x.a);
  }

  articles = articles.slice(0, 30);

  if (articles.length === 0) {
    feedEl.innerHTML = '';
    const hasPeople = peopleEl && peopleEl.innerHTML.trim().length > 0;
    emptyEl.innerHTML = hasPeople ? '' : `
      <div class="empty-state">
        <h3>Nothing here yet</h3>
        <p>${searchQuery ? `No articles matched "${escapeHtml(searchQuery)}".` : 'Be the first to publish research in this topic.'}</p>
      </div>`;
    return;
  }

  emptyEl.innerHTML = '';
  feedEl.innerHTML = articles.map(articleRow).join('');
}

function subscribeRealtime() {
  if (realtimeChannel) {
    try { supabase.removeChannel(realtimeChannel); } catch (_) {}
    realtimeChannel = null;
  }

  // Live updates: new/updated published articles appear without manual refresh
  realtimeChannel = supabase
    .channel('vequence-articles-feed')
    .on(
      'postgres_changes',
      { event: 'INSERT', schema: 'public', table: 'articles' },
      (payload) => {
        if (payload.new?.status === 'published') {
          // Soft refresh so the latest article shows up immediately
          loadFeed();
        }
      }
    )
    .on(
      'postgres_changes',
      { event: 'UPDATE', schema: 'public', table: 'articles' },
      (payload) => {
        // Status changed to published, or engagement counts updated
        if (payload.new?.status === 'published') {
          loadFeed();
        } else if (payload.old?.status === 'published' && payload.new?.status !== 'published') {
          loadFeed();
        }
      }
    )
    .on(
      'postgres_changes',
      { event: 'DELETE', schema: 'public', table: 'articles' },
      () => { loadFeed(); }
    )
    .subscribe((status) => {
      if (status === 'SUBSCRIBED') {
        // Connected — feed stays live
      }
    });

  // Clean up when leaving the page
  window.addEventListener('beforeunload', () => {
    if (realtimeChannel) {
      try { supabase.removeChannel(realtimeChannel); } catch (_) {}
    }
  });
}

sortSelect.addEventListener('change', () => {
  sortMode = sortSelect.value;
  loadFeed();
});
</script>
</body>
</html>
